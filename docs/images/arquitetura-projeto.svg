<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do pipeline Azure SQL para Snowflake</title>
  <desc id="desc">Airflow orquestra a ingestão de Azure SQL com Python para Bronze no Snowflake. dbt transforma os dados em Silver e Gold e executa testes. Docker Compose executa Airflow e PostgreSQL localmente. Git e GitHub versionam o projeto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111e32"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153e75"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5eefb}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#9fb2cc}.label{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#8da5c3}.box-title{font-size:19px;font-weight:700}.body{font-size:14px;fill:#c4d2e5}.small{font-size:12px;fill:#9fb2cc}.chip{font-size:12px;font-weight:600}.line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8ba0ba;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1440" height="850" rx="24" fill="url(#bg)"/>
  <text x="64" y="68" class="title">Pipeline de dados | Azure SQL → Snowflake</text>
  <text x="64" y="99" class="subtitle">Ingestão, transformação e qualidade de dados em uma arquitetura Medallion orquestrada pelo Airflow</text>

  <text x="64" y="163" class="label">FLUXO DE DADOS</text>
  <g filter="url(#shadow)">
    <rect x="64" y="190" width="220" height="150" rx="18" fill="#16263d" stroke="#3b82f6" stroke-width="2"/>
    <rect x="314" y="190" width="245" height="150" rx="18" fill="url(#blue)"/>
    <rect x="590" y="190" width="220" height="150" rx="18" fill="url(#snow)"/>
    <rect x="841" y="190" width="220" height="150" rx="18" fill="#374151" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="1092" y="190" width="220" height="150" rx="18" fill="#374151" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="1092" y="389" width="220" height="110" rx="18" fill="#263449" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <path d="M284 265H305" class="line"/><path d="M559 265H581" class="line"/><path d="M810 265H832" class="line"/><path d="M1061 265H1083" class="line"/>
  <path d="M1202 340V380" class="line"/>

  <text x="88" y="229" class="label">ORIGEM</text><text x="88" y="264" class="box-title">Azure SQL</text>
  <text x="88" y="292" class="body">Banco relacional</text><text x="88" y="315" class="small">Dados operacionais</text>

  <text x="338" y="229" class="label">INGESTÃO</text><text x="338" y="264" class="box-title">Python + pyodbc</text>
  <text x="338" y="292" class="body">Extrai e carrega tabelas</text><text x="338" y="315" class="small">Carga inicial ou incremental</text>

  <text x="614" y="229" class="label">SNOWFLAKE · BRONZE</text><text x="614" y="264" class="box-title">Dados ingeridos</text>
  <text x="614" y="292" class="body">Histórico e controle</text><text x="614" y="315" class="small">Camada bruta</text>

  <text x="865" y="229" class="label">DBT · SILVER</text><text x="865" y="264" class="box-title">Dados tratados</text>
  <text x="865" y="292" class="body">Limpeza e padronização</text><text x="865" y="315" class="small">Modelos SQL reutilizáveis</text>

  <text x="1116" y="229" class="label">DBT · GOLD</text><text x="1116" y="264" class="box-title">Dados analíticos</text>
  <text x="1116" y="292" class="body">Modelos de negócio</text><text x="1116" y="315" class="small">Prontos para análise</text>

  <text x="1116" y="425" class="box-title">Testes dbt</text><text x="1116" y="451" class="body">Integridade e qualidade</text><text x="1116" y="474" class="small">Executados ao final do fluxo</text>

  <rect x="64" y="390" width="997" height="109" rx="18" fill="#14253b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="91" y="426" class="label">ORQUESTRAÇÃO</text><text x="91" y="458" class="box-title">Apache Airflow</text>
  <text x="300" y="432" class="body">A DAG define dependências e executa as etapas em sequência:</text>
  <g>
    <rect x="300" y="449" width="155" height="30" rx="15" fill="#1e3a5f"/><text x="318" y="469" class="chip">1 · Ingestão</text>
    <rect x="465" y="449" width="145" height="30" rx="15" fill="#1e3a5f"/><text x="483" y="469" class="chip">2 · dbt debug</text>
    <rect x="620" y="449" width="145" height="30" rx="15" fill="#1e3a5f"/><text x="638" y="469" class="chip">3 · Silver</text>
    <rect x="775" y="449" width="130" height="30" rx="15" fill="#1e3a5f"/><text x="793" y="469" class="chip">4 · Gold</text>
    <rect x="915" y="449" width="125" height="30" rx="15" fill="#1e3a5f"/><text x="930" y="469" class="chip">5 · Testes</text>
  </g>
  <path d="M421 340V379" class="dash"/><path d="M700 340V379" class="dash"/><path d="M950 340V379" class="dash"/><path d="M1200 340V379" class="dash"/>

  <text x="64" y="555" class="label">AMBIENTE LOCAL E SUPORTE</text>
  <g filter="url(#shadow)">
    <rect x="64" y="579" width="402" height="176" rx="18" fill="#172337" stroke="#64748b" stroke-width="1.5"/>
    <rect x="493" y="579" width="402" height="176" rx="18" fill="#172337" stroke="#64748b" stroke-width="1.5"/>
    <rect x="922" y="579" width="390" height="176" rx="18" fill="#172337" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="91" y="619" class="label">EXECUÇÃO</text><text x="91" y="652" class="box-title">Docker Compose</text>
  <text x="91" y="681" class="body">Executa os serviços em containers</text><text x="91" y="706" class="small">Airflow · aplicação · ambiente local</text>
  <text x="520" y="619" class="label">METADADOS DO AIRFLOW</text><text x="520" y="652" class="box-title">PostgreSQL</text>
  <text x="520" y="681" class="body">Armazena estado e metadados</text><text x="520" y="706" class="small">Volume persistente configurado no Compose</text>
  <text x="949" y="619" class="label">VERSIONAMENTO</text><text x="949" y="652" class="box-title">Git + GitHub</text>
  <text x="949" y="681" class="body">Histórico e hospedagem do código</text><text x="949" y="706" class="small">Não representa um deploy automático</text>
  <path d="M265 499V568" class="dash"/><path d="M694 499V568" class="dash"/>
  <text x="64" y="808" class="small">Credenciais são fornecidas por variáveis de ambiente (.env local, não versionado).</text>
  <text x="1312" y="808" text-anchor="end" class="small">Arquitetura atual do repositório</text>
</svg>
